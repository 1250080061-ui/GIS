{% extends 'library_app/base.html' %}
{% block page_title %}Đặt lại mật khẩu{% endblock %}

{% block content %}
<div style="max-width:520px;margin:40px auto;">
  <div class="card">
    <div class="card-head">
      <span class="card-title"><i class="ph ph-lock-key"></i> Đặt lại mật khẩu</span>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label">Mật khẩu mới</label>
          {{ form.new_password1 }}
        </div>

        <div class="form-group">
          <label class="form-label">Nhập lại mật khẩu mới</label>
          {{ form.new_password2 }}
        </div>

        <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
