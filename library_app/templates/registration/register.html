{% extends 'library_app/base.html' %}

{% block content %}
<div class="container">
  <h2 class="text-center">Đăng ký tài khoản</h2>
  <form method="POST" class="form-signup">
    {% csrf_token %}
    
    <div class="form-group">
      <label for="id_username">Tên đăng nhập</label>
      <input type="text" name="username" class="form-control" id="id_username" placeholder="Nhập tên đăng nhập" required>
    </div>

    <div class="form-group">
      <label for="id_password1">Mật khẩu</label>
      <input type="password" name="password1" class="form-control" id="id_password1" placeholder="Nhập mật khẩu" required>
    </div>

    <div class="form-group">
      <label for="id_password2">Xác nhận mật khẩu</label>
      <input type="password" name="password2" class="form-control" id="id_password2" placeholder="Nhập lại mật khẩu" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
  </form>

  <div class="text-center mt-3">
    <p>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập ngay</a></p>
  </div>
</div>
{% endblock %}
