{% extends 'library_app/base.html' %}
{% block page_title %}Quên mật khẩu{% endblock %}

{% block content %}
<div style="max-width:520px;margin:40px auto;">
  <div class="card">
    <div class="card-head">
      <span class="card-title"><i class="ph ph-key"></i> Quên mật khẩu</span>
    </div>
    <div class="card-body">
      <p class="text-muted">Nhập email để nhận liên kết đặt lại mật khẩu.</p>

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email</label>
          {{ form.email }}
        </div>

        <div class="flex-gap" style="margin-top:20px;">
          <button type="submit" class="btn btn-primary">Gửi liên kết</button>
          <a href="{% url 'login' %}" class="btn btn-ghost">Quay lại</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
