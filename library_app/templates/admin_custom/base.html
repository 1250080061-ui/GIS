<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LibraryGIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar { width: 250px; height: 100vh; position: fixed; background: #2c3e50; color: white; }
        .sidebar a { color: #bdc3c7; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background: #34495e; color: white; }
        .content { margin-left: 250px; padding: 20px; background: #f8f9fa; min-height: 100vh; }
        .card-stat { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center py-4">LibraryGIS</h4>
        <a href="{% url 'admin_dashboard' %}"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="{% url 'library_list' %}"><i class="fas fa-map-marked-alt me-2"></i> Thư viện toàn quốc</a> <a href="{% url 'book_list' %}"><i class="fas fa-book me-2"></i> Kho sách</a> <a href="{% url 'loan_list' %}"><i class="fas fa-exchange-alt me-2"></i> Mượn / Trả</a> <a href="{% url 'fine_list' %}"><i class="fas fa-money-bill-wave me-2"></i> Quản lý phí phạt</a> </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
